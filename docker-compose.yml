services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme_local_superuser_password
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    volumes:
      - marketplace_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Pact Broker (HW 16): contract storage and the can-i-deploy gate.
  # Local broker: http://127.0.0.1:9292 (not a secret, just this compose file's address).
  pact-broker-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact_local_dev_password
      POSTGRES_DB: pact
    volumes:
      - pact_broker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact -d pact"]
      interval: 5s
      timeout: 3s
      retries: 10

  pact-broker:
    image: pactfoundation/pact-broker:latest
    depends_on:
      pact-broker-db:
        condition: service_healthy
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_DATABASE_URL: postgres://pact:pact_local_dev_password@pact-broker-db/pact
      PACT_BROKER_LOG_LEVEL: INFO
      PACT_BROKER_PORT: "9292"
    healthcheck:
      # 127.0.0.1 rather than localhost: inside the container localhost may resolve to
      # ::1, while puma listens on IPv4 only.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9292/diagnostic/status/heartbeat || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # RabbitMQ (HW 19): the broker between the API (producer) and the consumer.
  # Image with -management: UI at http://127.0.0.1:15672 (app/app) to look at x-death.
  # AMQP port is 5672; 15672 is the management web UI and does NOT speak AMQP.
  # app/app are dev credentials of this compose file, not a secret.
  rabbitmq:
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      # check_running, not "the port is open": the TCP port opens before the Erlang
      # node starts accepting basic.publish (otherwise the client gets ECONNRESET).
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

volumes:
  marketplace_pgdata:
  pact_broker_pgdata:
