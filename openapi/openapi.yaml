openapi: 3.0.3
info:
  title: Marketplace API
  version: "1.0.0"
  description: >
    Contract for the Marketplace project: products catalog and order
    creation. No authorization exists yet in this version of the API.

security: []

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Products
    description: Product catalog
  - name: Orders
    description: Order creation and lookup

paths:
  /products:
    get:
      operationId: listProducts
      tags: [Products]
      summary: List products
      description: >
        Returns a cursor-paginated list of products from the catalog,
        ordered by creation date (newest first).
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: A page of products.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
              example:
                items:
                  - id: prod_1
                    name: Mechanical Keyboard
                    description: Hot-swappable 75% keyboard
                    price_cents: 8999
                    stock: 12
                  - id: prod_2
                    name: Wireless Mouse
                    description: Ergonomic wireless mouse
                    price_cents: 2500
                    stock: 40
                next_cursor: "eyJvZmZzZXQiOjJ9"
        "400":
          $ref: "#/components/responses/BadRequest"

  /products/{productId}:
    get:
      operationId: getProductById
      tags: [Products]
      summary: Get a single product
      description: Returns a single product by its identifier.
      parameters:
        - $ref: "#/components/parameters/ProductIdParam"
      responses:
        "200":
          description: The requested product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders:
    get:
      operationId: listOrders
      tags: [Orders]
      summary: List orders
      description: >
        Returns a cursor-paginated list of orders, ordered by creation date
        (newest first).
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        "400":
          $ref: "#/components/responses/BadRequest"

    post:
      operationId: createOrder
      tags: [Orders]
      summary: Create an order
      description: >
        Creates a new order from a list of product line items. This
        operation is idempotent: it must be called with an Idempotency-Key
        header (see the parameter description below).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            Client-generated unique token for this create-order attempt
            (a UUID v4 is recommended). Replaying the same Idempotency-Key
            together with the exact same request body returns the original
            201 response again (with an Idempotency-Replay: true header)
            instead of creating a second order. Reusing the same key with a
            different request body is a conflict and is rejected with 422.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              items:
                - product_id: prod_1
                  quantity: 1
                - product_id: prod_2
                  quantity: 2
      responses:
        "201":
          description: The created order.
          headers:
            Idempotency-Replay:
              description: >
                Present and set to "true" only when this response was
                served from a previous call with the same Idempotency-Key
                and the same request body, instead of creating a new order.
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /orders/{orderId}:
    get:
      operationId: getOrderById
      tags: [Orders]
      summary: Get a single order
      description: Returns a single order by its identifier.
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
      responses:
        "200":
          description: The requested order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{orderId}/events:
    get:
      operationId: streamOrderEvents
      tags: [Orders]
      summary: Stream status changes of an order (Server-Sent Events)
      description: >
        Opens a text/event-stream response that stays open. Every status
        change is sent as an event named order.status with a JSON data line
        and an id that grows by one per order (1, 2, 3...). After a dropped
        connection the client reconnects with the Last-Event-ID header and
        first receives the buffered events with a greater id. Without the
        header the whole buffer is sent. The buffer is kept in memory (last
        100 events per order) and is emptied by a server restart.
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
        - name: Last-Event-ID
          in: header
          required: false
          description: Id of the last event the client has received.
          schema:
            type: string
          example: "3"
      responses:
        "200":
          description: An open event stream.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 1
                event: order.status
                data: {"order_id":"7","status":"paid","changed_at":"2026-10-28T14:20:05.123Z"}
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{orderId}/status:
    patch:
      operationId: changeOrderStatus
      tags: [Orders]
      summary: Change the status of an order
      description: >
        Moves an order along its life cycle: pending, paid, processing,
        shipped, delivered. Before shipping (pending, paid, processing) an
        order can also become cancelled, which returns the reserved stock to
        the products. delivered and cancelled are final. A change the life
        cycle does not allow (for example pending to shipped, or any change of
        a final order) is rejected with 409. After the change, an order.status
        event is pushed to clients subscribed to this order.
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOrderStatusRequest"
      responses:
        "200":
          description: The order with its new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  parameters:
    LimitParam:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return in a single page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    CursorParam:
      name: cursor
      in: query
      required: false
      description: >
        Opaque pagination cursor returned as next_cursor by a previous call
        to this operation. Clients must treat it as an opaque token: its
        internal format is not part of the contract and may change at any
        time. Omit it to fetch the first page.
      schema:
        type: string

    ProductIdParam:
      name: productId
      in: path
      required: true
      description: Identifier of the product.
      schema:
        type: string

    OrderIdParam:
      name: orderId
      in: path
      required: true
      description: Identifier of the order.
      schema:
        type: string

  responses:
    BadRequest:
      description: The request is malformed or failed validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    NotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Conflict:
      description: >
        The request conflicts with the current state. Creating an order: at
        least one product does not have enough stock (type insufficient-stock;
        nothing is reserved or created, the client may retry with smaller
        quantities). Changing a status: the life cycle does not allow this change
        from the current status (type invalid-status-transition).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    UnprocessableEntity:
      description: >
        The request is well-formed but conflicts with existing state
        (for example, an Idempotency-Key reused with a different body).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: RFC 7807 problem+json error body.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri-reference
          description: >
            A URI identifying the problem type. Clients can switch on it to
            tell apart errors that share a status code or need different handling.
          example: https://marketplace.example/problems/validation-error
        title:
          type: string
          description: Short, human-readable summary of the problem type.
          example: Bad Request
        status:
          type: integer
          description: The HTTP status code for this occurrence of the problem.
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          example: "request/body/items must NOT have fewer than 1 items"
        instance:
          type: string
          description: URI reference identifying the specific occurrence of the problem.
          example: /orders

    Product:
      type: object
      required: [id, name, price_cents, stock]
      properties:
        id:
          type: string
          example: prod_1
        name:
          type: string
          example: Mechanical Keyboard
        description:
          type: string
          example: Hot-swappable 75% keyboard
        price_cents:
          type: integer
          description: Price in the smallest currency unit (cents). Never a decimal string.
          example: 8999
        stock:
          type: integer
          description: Remaining quantity in stock.
          example: 12
        seller_id:
          type: string
          description: >
            Identifier of the seller (User) who owns the product. Not required
            yet: populated once authentication is added.
          example: user_1
        photos:
          type: array
          description: >
            URLs of product photos. Not required yet: populated once file
            uploads are added.
          items:
            type: string
            format: uri
          example: ["https://cdn.example.com/photos/prod_1_1.jpg"]

    ProductPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page, or null if there are no more pages.

    OrderItem:
      type: object
      required: [product_id, quantity, unit_price_cents]
      properties:
        product_id:
          type: string
          example: prod_1
        quantity:
          type: integer
          minimum: 1
          example: 1
        unit_price_cents:
          type: integer
          description: Product price in cents at the time the order was created.
          example: 8999

    Order:
      type: object
      required: [id, status, items, total_cents, created_at]
      properties:
        id:
          type: string
          example: order_1
        buyer_id:
          type: string
          description: >
            Identifier of the buyer (User) who placed the order. Not required
            yet: populated once authentication is added.
          example: user_2
        status:
          type: string
          enum: [pending, paid, processing, shipped, delivered, cancelled]
          example: pending
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"
        total_cents:
          type: integer
          description: Sum of unit_price_cents * quantity across all items, in cents.
          example: 13999
        created_at:
          type: string
          format: date-time

    OrderPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page, or null if there are no more pages.

    ChangeOrderStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [paid, processing, shipped, delivered, cancelled]
          example: paid

    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [product_id, quantity]
            properties:
              product_id:
                type: string
                example: prod_1
              quantity:
                type: integer
                minimum: 1
                example: 1
