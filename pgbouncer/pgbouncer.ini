; PgBouncer курсового проєкту (ДЗ №15). Застосунок ходить у Postgres ТІЛЬКИ
; через нього; прямий порт Postgres лишається для адмін-задач (pg_dump, drill).
[databases]
marketplace = host=postgres port=5432 dbname=marketplace

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; SCRAM: пароль у userlist.txt має збігатися з паролем Postgres
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Кожен statement/транзакція клієнта бере серверне з'єднання лише на час
; транзакції — 200 клієнтів обслуговуються 10 з'єднаннями до Postgres.
pool_mode = transaction
default_pool_size = 10
min_pool_size = 0
reserve_pool_size = 2
max_client_conn = 200
max_db_connections = 20

; Named prepared statements драйвера переживають транзакцію — PgBouncer >= 1.21
; вміє їх трекати (потрібен при pool_mode = transaction).
max_prepared_statements = 200

; Адмін-консоль: psql -p 6432 -U marketplace_app -d pgbouncer -c "SHOW POOLS"
admin_users = marketplace_app
stats_users = marketplace_app

ignore_startup_parameters = extra_float_digits
server_reset_query =
log_connections = 0
log_disconnections = 0
