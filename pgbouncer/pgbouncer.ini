; PgBouncer for the course project (HW 15). The app reaches Postgres ONLY
; through it; the direct Postgres port stays for admin tasks (pg_dump, drill).
[databases]
marketplace = host=postgres port=5432 dbname=marketplace

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; SCRAM: the password in userlist.txt must match the Postgres password
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; A client holds a server connection only for the duration of a transaction:
; 200 clients are served by 10 connections to Postgres.
pool_mode = transaction
default_pool_size = 10
min_pool_size = 0
reserve_pool_size = 2
max_client_conn = 200
max_db_connections = 20

; A driver's named prepared statements outlive a transaction; PgBouncer >= 1.21
; can track them (needed with pool_mode = transaction).
max_prepared_statements = 200

; Admin console: psql -p 6432 -U marketplace_app -d pgbouncer -c "SHOW POOLS"
admin_users = marketplace_app
stats_users = marketplace_app

ignore_startup_parameters = extra_float_digits
server_reset_query =
log_connections = 0
log_disconnections = 0
